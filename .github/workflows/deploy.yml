name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_TURN_URLS: ${{ vars.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}
          VITE_PEER_HOST: ${{ vars.PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.PEER_PATH }}
          VITE_PEER_SECURE: ${{ vars.PEER_SECURE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
